[project]
name = "ia-service"
version = "0.3.1"
description = "Microservicio de IA de MedCare (Track C) — NLP y predicción de no-show"
requires-python = ">=3.11"

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["app", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "C4"]
ignore = ["B008"]  # Depends() en defaults de FastAPI

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["."]
filterwarnings = ["ignore::DeprecationWarning"]